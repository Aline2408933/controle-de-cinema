<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Sessões</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Cinema Control</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" id="menuPrincipal"></ul>
    </div>
  </div>
</nav>
<main class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card card-shadow">
        <div class="card-header bg-white">
          <h3 class="mb-0">Cadastro de Sessões</h3>
        </div>
        <div class="card-body">
          <div id="alertaSessoes"></div>
          <form id="formSessoes" class="row g-3">
            <input type="hidden" name="id">
            <div class="col-md-6">
              <label class="form-label">Filme</label>
              <select class="form-select" id="filme" name="filme" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Sala</label>
              <select class="form-select" id="sala" name="sala" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Data e Hora</label>
              <input type="datetime-local" class="form-control" name="dataHora" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Preço</label>
              <input type="number" step="0.01" class="form-control" name="preco" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Idioma</label>
              <select class="form-select" name="idioma" required>
                <option>Dublado</option>
                <option>Legendado</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Formato</label>
              <select class="form-select" name="formato" required>
                <option>2D</option>
                <option>3D</option>
              </select>
            </div>
            <div class="col-12">
              <button class="btn btn-primary">Salvar Sessão</button>
              <button type="button" class="btn btn-secondary d-none ms-2" id="cancelarSessao">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card card-shadow mt-4">
        <div class="card-header bg-white">
          <h5 class="mb-0">Sessões cadastradas</h5>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead>
              <tr>
                <th>#</th><th>Filme</th><th>Sala</th><th>Data e Hora</th><th>Preço</th><th>ID</th><th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaSessoesCadastro"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
