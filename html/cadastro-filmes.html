

<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Filmes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Cinema Control</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" id="menuPrincipal"></ul>
    </div>
  </div>
</nav>
<main class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card card-shadow">
        <div class="card-header bg-white">
          <h3 class="mb-0">Cadastro de Filmes</h3>
        </div>
        <div class="card-body">
          <div id="alertaFilmes"></div>
          <form id="formFilmes" class="row g-3">
            <input type="hidden" name="id">
            <div class="col-md-6">
              <label class="form-label">Título</label>
              <input type="text" class="form-control" name="titulo" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Gênero</label>
              <input type="text" class="form-control" name="genero" required>
            </div>
            <div class="col-12">
              <label class="form-label">Descrição</label>
              <textarea class="form-control" name="descricao" rows="3" required></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Classificação Indicativa</label>
              <select class="form-select" name="classificacao" required>
                <option value="">Selecione</option>
                <option>Livre</option>
                <option>10 anos</option>
                <option>12 anos</option>
                <option>14 anos</option>
                <option>16 anos</option>
                <option>18 anos</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Duração (min)</label>
              <input type="number" class="form-control" name="duracao" min="1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Data de Estreia</label>
              <input type="date" class="form-control" name="dataEstreia" required>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary">Salvar Filme</button>
              <button type="button" id="cancelarFilme" class="btn btn-secondary d-none">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card card-shadow mt-4">
        <div class="card-header bg-white">
          <h5 class="mb-0">Filmes cadastrados</h5>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead>
              <tr>
                <th>#</th><th>Título</th><th>Gênero</th><th>Classificação</th><th>Duração</th><th>Estreia</th><th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaFilmes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
