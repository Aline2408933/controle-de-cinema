<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venda de Ingressos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Cinema Control</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" id="menuPrincipal"></ul>
    </div>
  </div>
</nav>
<main class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card card-shadow">
        <div class="card-header bg-white">
          <h3 class="mb-0">Venda de Ingressos</h3>
        </div>
        <div class="card-body">
          <div id="alertaIngressos"></div>
          <form id="formIngressos" class="row g-3">
            <input type="hidden" name="id">
            <div class="col-12">
              <label class="form-label">Sessão</label>
              <select class="form-select" id="sessao" name="sessao" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Nome do Cliente</label>
              <input type="text" class="form-control" name="cliente" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">CPF</label>
              <input type="text" class="form-control" name="cpf" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Assento</label>
              <input type="text" class="form-control" name="assento" placeholder="A10" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo de Pagamento</label>
              <select class="form-select" name="pagamento" required>
                <option>Cartão</option>
                <option>Pix</option>
                <option>Dinheiro</option>
              </select>
            </div>
            <div class="col-12">
              <button class="btn btn-primary">Confirmar Venda</button>
              <button type="button" class="btn btn-secondary d-none ms-2" id="cancelarIngresso">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
      <div class="card card-shadow mt-4">
        <div class="card-header bg-white">
          <h5 class="mb-0">Ingressos vendidos</h5>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead>
              <tr>
                <th>#</th><th>Sessão</th><th>Cliente</th><th>CPF</th><th>Assento</th><th>Pagamento</th><th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaIngressos"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
