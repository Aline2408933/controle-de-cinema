<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Cinema Negreiros</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" id="menuPrincipal"></ul>
    </div>
  </div>
</nav>
<main class="container py-4">

  <div class="p-4 p-md-5 mb-4 bg-white rounded-3 card-shadow">
    <div class="container-fluid py-2">
      <h1 class="display-6 fw-bold">Controle de Cinema</h1>
      <p class="col-md-10 fs-5 mb-0">
        Cadastre filmes, salas, sessões.
      </p>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card card-shadow">
        <div class="card-body">
          <h6>Filmes</h6>
          <div class="display-6" id="countFilmes">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-shadow">
        <div class="card-body">
          <h6>Salas</h6>
          <div class="display-6" id="countSalas">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-shadow">
        <div class="card-body">
          <h6>Sessões</h6>
          <div class="display-6" id="countSessoes">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-shadow">
        <div class="card-body">
          <h6>Ingressos</h6>
          <div class="display-6" id="countIngressos">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-primary" href="cadastro-filmes.html">Cadastrar filme</a>
    <a class="btn btn-primary" href="cadastro-salas.html">Cadastrar sala</a>
    <a class="btn btn-primary" href="cadastro-sessoes.html">Cadastrar sessão</a>
    <a class="btn btn-primary" href="venda-ingressos.html">Vender ingresso</a>
    <a class="btn btn-outline-secondary" href="sessoes.html">Ver sessões</a>
    <button class="btn btn-outline-danger ms-auto" id="btnLimparDados">Limpar dados</button>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
