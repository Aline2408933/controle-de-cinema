<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Cinema Control</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" id="menuPrincipal"></ul>
    </div>
  </div>
</nav>
<main class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-shadow">
        <div class="card-header bg-white">
          <h3 class="mb-0">Cadastro de Salas</h3>
        </div>
        <div class="card-body">
          <div id="alertaSalas"></div>
          <form id="formSalas" class="row g-3">
            <input type="hidden" name="id">
            <div class="col-md-6">
              <label class="form-label">Nome da Sala</label>
              <input type="text" class="form-control" name="nome" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Capacidade</label>
              <input type="number" class="form-control" name="capacidade" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Tipo</label>
              <select class="form-select" name="tipo" required>
                <option value="">Selecione</option>
                <option>2D</option>
                <option>3D</option>
                <option>IMAX</option>
              </select>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary">Salvar Sala</button>
              <button type="button" id="cancelarSala" class="btn btn-secondary d-none">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card card-shadow mt-4">
        <div class="card-header bg-white">
          <h5 class="mb-0">Salas cadastradas</h5>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead>
              <tr>
                <th>#</th><th>Nome</th><th>Capacidade</th><th>Tipo</th><th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaSalas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
